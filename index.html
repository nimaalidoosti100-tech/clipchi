<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>کلیپچی | شورت‌های Roblox، CS، Minecraft و COD</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; font-family: Vazirmatn, system-ui, sans-serif; }
    body {
      margin: 0;
      padding: 14px;
      background: #0b0e14;
      color: #f3f4f6;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #0b0e14;
      padding-bottom: 10px;
      border-bottom: 1px solid #1d2536;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 10px;
    }
    .smart-box, .add-box, .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #293348;
      background: #141a26;
      color: #fff;
      font-size: 13px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 6px 0 8px;
    }
    .chip {
      border: 1px solid #293348;
      background: #141a26;
      color: #cbd5e1;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11.5px;
      cursor: pointer;
    }
    .chip.active {
      background: #7c3aed;
      border-color: #7c3aed;
      color: #fff;
      font-weight: 700;
    }
    .smart-tip {
      font-size: 12px;
      color: #c4b5fd;
      background: #171329;
      border: 1px solid #3b2d6b;
      padding: 8px 10px;
      border-radius: 10px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .yt-search-btn {
      align-self: flex-start;
      border: 0;
      border-radius: 8px;
      background: #dc2626;
      color: #fff;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .card {
      background: #141a26;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.32);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
    }
    .badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #241938;
      color: #ddd6fe;
      white-space: nowrap;
    }
    .player-wrap.short {
      position: relative;
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    button.action-btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 6px;
      background: #20293b;
      color: #fff;
      font-size: 12.5px;
      cursor: pointer;
    }
    button.like-btn.liked {
      background: #e11d48;
    }
    .comments-box {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .comment-item {
      background: #0e131c;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12.5px;
    }
    .comment-form {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .primary-btn, .smart-btn {
      border: 0;
      border-radius: 10px;
      color: #fff;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .primary-btn {
      background: #7c3aed;
    }
    .smart-btn {
      background: #2563eb;
    }
    .empty {
      text-align: center;
      color: #94a3b8;
      padding: 24px 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎮 کلیپچی | شورت‌های Roblox، CS، Minecraft و COD</h1>

    <div class="smart-box">
      <input id="smartPromptInput" type="text" placeholder="چی می‌خوای؟ (مثلاً: روبلاس، CS، ماینکرفت، کالاف)..." />
      <button class="smart-btn" onclick="runSmartAssist()">بررسی و جستجو</button>
    </div>

    <div class="smart-tip" id="smartTip">
      <span id="smartMessage">🎮 هر عبارتی بنویسی، پیشنهاد مرتبط را می‌دهم و می‌توانی مستقیم در یوتیوب Shorts هم بگردی.</span>
      <button class="yt-search-btn" id="ytSearchAction" onclick="openYoutubeSearch()">🔎 جستجو در یوتیوب Shorts</button>
    </div>

    <div class="chips" id="categoryChips">
      <button class="chip active" data-cat="all" onclick="selectCategory('all')">همه بازی‌ها</button>
      <button class="chip" data-cat="roblox" onclick="selectCategory('roblox')">🟥 روبلاکس (Roblox)</button>
      <button class="chip" data-cat="cs" onclick="selectCategory('cs')">🔫 CS (کانتر)</button>
      <button class="chip" data-cat="minecraft" onclick="selectCategory('minecraft')">🧱 ماینکرفت</button>
      <button class="chip" data-cat="cod" onclick="selectCategory('cod')">🎯 کالاف (COD)</button>
    </div>

    <div class="search-box">
      <input id="searchInput" type="text" placeholder="فیلتر سریع در عنوان شورت‌ها..." oninput="renderFeed()" />
    </div>

    <div class="add-box">
      <input id="ytShortInput" type="text" placeholder="لینک YouTube Shorts را اینجا پیست کن..." />
      <button class="primary-btn" onclick="addShortFromUrl()">افزودن شورت</button>
    </div>

    <div class="stats-bar">
      <span id="activeModeLabel">حالت: همه بازی‌ها</span>
      <span id="shortCount"></span>
    </div>
  </header>

  <div id="feed"></div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) tg.ready();

    let selectedCategory = "all";
    let lastYoutubeQuery = "Roblox shorts";

    const shorts = [
      {
        title: "روبلاکس (Roblox): لحظه کوتاه سرگرم‌کننده و اکشن",
        youtubeId: "eRsGyueVLvQ",
        category: "roblox",
        gameLabel: "Roblox",
        likes: 184,
        comments: ["فان بود!"]
      },
      {
        title: "CS (کانتر): کلیپ کوتاه و هیجانی",
        youtubeId: "YE7VzlLtp-4",
        category: "cs",
        gameLabel: "CS",
        likes: 229,
        comments: ["پخش عمودی عالیه"]
      },
      {
        title: "ماینکرفت (Minecraft): دنیای بلوکی و ساخت‌وساز",
        youtubeId: "aqz-KE-bpKQ",
        category: "minecraft",
        gameLabel: "Minecraft",
        likes: 265,
        comments: ["فضای باحالی داره"]
      },
      {
        title: "کالاف (COD): صحنه کوتاه پرانرژی و ریتمیک",
        youtubeId: "3JZ_D3ELwOQ",
        category: "cod",
        gameLabel: "Call of Duty",
        likes: 312,
        comments: ["برای هایلایت کالاف عالیه"]
      }
    ];

    const gameRules = [
      { cat: "roblox", ytQuery: "Roblox shorts", words: ["روبلاکس", "روبلاس", "roblox", "rblx"] },
      { cat: "cs", ytQuery: "Counter Strike shorts", words: ["cs", "کانتر", "counter", "استرایک", "strike", "cs2", "csgo"] },
      { cat: "minecraft", ytQuery: "Minecraft shorts", words: ["ماینکرفت", "ماینکرافت", "ماینکرف", "minecraft", "mc"] },
      { cat: "cod", ytQuery: "Call of Duty shorts", words: ["کالاف", "کال اف", "cod", "call of duty", "وارزون", "warzone"] }
    ];

    function findGameRule(text) {
      const lower = text.toLowerCase();
      for (const rule of gameRules) {
        if (rule.words.some(w => lower.includes(w))) {
          return rule;
        }
      }
      return null;
    }

    window.runSmartAssist = function() {
      const input = document.getElementById("smartPromptInput");
      const searchInput = document.getElementById("searchInput");
      const msgEl = document.getElementById("smartMessage");
      const btnEl = document.getElementById("ytSearchAction");
      const raw = input.value.trim();

      if (!raw) {
        selectCategory("all", false);
        searchInput.value = "";
        lastYoutubeQuery = "gaming shorts";
        msgEl.textContent = "🎮 همه شورت‌ها نمایش داده شدند. یک بازی بنویس تا پیشنهاد بدهم.";
        btnEl.textContent = "🔎 جستجو در یوتیوب Shorts";
        renderFeed();
        return;
      }

      const matched = findGameRule(raw);
      if (matched) {
        selectCategory(matched.cat, false);
        searchInput.value = "";
        lastYoutubeQuery = matched.ytQuery;
        msgEl.textContent = `✨ عبارت «${raw}» را به «${matched.ytQuery}» مَپ کردم؛ شورت‌های این دسته پایین آمده‌اند.`;
        btnEl.textContent = `🔎 باز کردن «${matched.ytQuery}» در یوتیوب`;
      } else {
        selectCategory("all", false);
        searchInput.value = raw;
        lastYoutubeQuery = `${raw} shorts`;
        msgEl.textContent = `🔎 برای «${raw}» در لیست گشتم؛ برای دیدن نتایج زنده در یوتیوب دکمه زیر را بزن.`;
        btnEl.textContent = `🔎 جستجوی «${lastYoutubeQuery}» در یوتیوب`;
      }

      renderFeed();
    };

    window.openYoutubeSearch = function() {
      const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(lastYoutubeQuery)}`;
      if (tg && typeof tg.openLink === "function") {
        tg.openLink(url);
      } else {
        window.open(url, "_blank");
      }
    };

    window.selectCategory = function(cat, updateTip = true) {
      selectedCategory = cat;
      document.querySelectorAll("#categoryChips .chip").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.cat === cat);
      });

      const names = {
        all: "همه بازی‌ها",
        roblox: "روبلاکس (Roblox)",
        cs: "CS (کانتر)",
        minecraft: "ماینکرفت (Minecraft)",
        cod: "کالاف (COD)"
      };
      const ytQueries = {
        all: "gaming shorts",
        roblox: "Roblox shorts",
        cs: "Counter Strike shorts",
        minecraft: "Minecraft shorts",
        cod: "Call of Duty shorts"
      };

      lastYoutubeQuery = ytQueries[cat] || "gaming shorts";
      document.getElementById("activeModeLabel").textContent = `حالت: ${names[cat] || "همه بازی‌ها"}`;
      document.getElementById("ytSearchAction").textContent = `🔎 جستجوی «${lastYoutubeQuery}» در یوتیوب`;

      if (updateTip) {
        document.getElementById("smartMessage").textContent = `🎮 فیلتر روی «${names[cat]}» تنظیم شد.`;
      }

      renderFeed();
    };

    function extractShortId(inputText) {
      const clean = inputText.trim();
      const shortMatch = clean.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/);
      if (shortMatch) return shortMatch[1];

      const watchMatch = clean.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
      if (watchMatch) return watchMatch[1];

      const youtuBeMatch = clean.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
      if (youtuBeMatch) return youtuBeMatch[1];

      const embedMatch = clean.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/);
      if (embedMatch) return embedMatch[1];

      if (/^[a-zA-Z0-9_-]{11}$/.test(clean)) return clean;
      return null;
    }

    window.addShortFromUrl = function() {
      const input = document.getElementById("ytShortInput");
      const shortId = extractShortId(input.value);
      if (!shortId) {
        alert("لطفاً یک لینک معتبر YouTube Shorts وارد کن.");
        return;
      }

      const targetCat = selectedCategory === "all" ? "roblox" : selectedCategory;
      const labels = {
        roblox: "Roblox",
        cs: "CS",
        minecraft: "Minecraft",
        cod: "Call of Duty"
      };

      shorts.unshift({
        title: `شورت جدید ${labels[targetCat]} اضافه شده توسط شما`,
        youtubeId: shortId,
        category: targetCat,
        gameLabel: labels[targetCat],
        likes: 1,
        comments: []
      });

      input.value = "";
      renderFeed();
    };

    function renderFeed() {
      const feedEl = document.getElementById("feed");
      const countEl = document.getElementById("shortCount");
      const query = document.getElementById("searchInput").value.trim().toLowerCase();

      const filtered = shorts
        .map((item, originalIndex) => ({ ...item, originalIndex }))
        .filter(item => {
          if (selectedCategory !== "all" && item.category !== selectedCategory) return false;
          if (query && !item.title.toLowerCase().includes(query) && !item.gameLabel.toLowerCase().includes(query)) return false;
          return true;
        });

      countEl.textContent = `${filtered.length} شورت`;

      if (!filtered.length) {
        feedEl.innerHTML = `<div class="empty">در لیست فعلی موردی پیدا نشد؛ از دکمه‌ی قرمز بالا برای جستجو در یوتیوب استفاده کن و لینک Short را پایین پیست کن.</div>`;
        return;
      }

      feedEl.innerHTML = "";

      filtered.forEach(item => {
        const idx = item.originalIndex;
        const card = document.createElement("div");
        card.className = "card";

        const commentsHtml = item.comments
          .map(c => `<div class="comment-item">💬 ${c}</div>`)
          .join("");

        card.innerHTML = `
          <div class="card-header">
            <div class="title">${item.title}</div>
            <span class="badge">🎮 ${item.gameLabel}</span>
          </div>

          <div class="player-wrap short">
            <iframe
              src="https://www.youtube.com/embed/${item.youtubeId}"
              title="${item.title}"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
            </iframe>
          </div>

          <div class="actions">
            <button class="action-btn like-btn ${item.liked ? "liked" : ""}" onclick="toggleLike(${idx})">
              ❤️ لایک (${item.likes})
            </button>
            <button class="action-btn" onclick="focusComment(${idx})">
              💬 کامنت (${item.comments.length})
            </button>
            <button class="action-btn" onclick="shareShort(${idx})">
              📤 ارسال به دوست
            </button>
          </div>

          <div class="comments-box">${commentsHtml}</div>

          <div class="comment-form">
            <input id="input-${idx}" type="text" placeholder="کامنت خودت رو بنویس..." />
            <button class="primary-btn" onclick="addComment(${idx})">ارسال</button>
          </div>
        `;

        feedEl.appendChild(card);
      });
    }

    window.toggleLike = function(idx) {
      shorts[idx].liked = !shorts[idx].liked;
      shorts[idx].likes += shorts[idx].liked ? 1 : -1;
      renderFeed();
    };

    window.focusComment = function(idx) {
      const el = document.getElementById(`input-${idx}`);
      if (el) el.focus();
    };

    window.addComment = function(idx) {
      const el = document.getElementById(`input-${idx}`);
      if (!el || !el.value.trim()) return;
      shorts[idx].comments.push(el.value.trim());
      el.value = "";
      renderFeed();
    };

    window.shareShort = function(idx) {
      const item = shorts[idx];
      const url = `https://www.youtube.com/shorts/${item.youtubeId}`;
      const text = `${item.title} را در کلیپچی ببین:`;
      if (tg && typeof tg.openTelegramLink === "function") {
        tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`);
      } else {
        window.open(url, "_blank");
      }
    };

    renderFeed();
  </script>
</body>
</html>
